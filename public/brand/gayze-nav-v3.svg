    d="M 205 500
       C 315 395 400 355 500 355
       C 600 355 685 395 795 500
       C 685 605 600 645 500 645
       C 400 645 315 605 205 500 Z"
    stroke="url(#eye)"
    stroke-width="10"
    opacity=".72"
  />

