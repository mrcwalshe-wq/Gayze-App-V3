  <title id="title">GAYZE Discover</title>
  <desc id="desc">GAYZE eye and G mark inside the purple, magenta, pink and amber brand ring.</desc>

  <!-- Brand ring from the supplied mark -->
  <circle cx="500" cy="500" r="421" stroke="url(#ring)" stroke-width="34"/>

  <!-- Correct GAYZE eye silhouette: clean almond outline, not a filled wedge -->
  <path
    d="M 125 500
       C 245 345 365 295 500 295
       C 635 295 755 345 875 500
       C 755 655 635 705 500 705
       C 365 705 245 655 125 500 Z"
    stroke="url(#eye)"
    stroke-width="30"
    stroke-linejoin="round"
    fill="rgba(0,0,0,0.02)"
  />

  <!-- Inner eye contour -->
