name: Apply messaging lifecycle integration

on:
  push:
    branches:
      - feature/messaging-media-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/messaging-media-lifecycle

      - name: Apply deterministic source patch
        run: python3 scripts/apply-messaging-lifecycle.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck/build/lint
        run: |
          npm run lint
          npm run build

      - name: Commit integrated changes
        run: |
          if git diff --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/App.tsx src/components/ChatRoomView.tsx
          git commit -m 'feat: integrate messaging lifecycle controls'
          git push origin HEAD:feature/messaging-media-lifecycle
